[PARSER]
    Name        java_multiline
    Format      regex
    Regex       ^(?<time>[\d\-]+\s[\d:,]+)\s+(?<level>[A-Z]+)\s+--- \[(?<thread>[^\]]+)\]\s+(?<class>[^\s]+)\s+:\s+(?<message>.*)
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S.%L
    Decode_Field_As   escaped    message
    Multiline   On
    Flush_Interval 1
    Timeout     5